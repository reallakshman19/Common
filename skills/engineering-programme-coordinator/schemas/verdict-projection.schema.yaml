$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-verdict-projection-v1
type: object
additionalProperties: false
required: [schema_version, authority, identity, source, candidate, ledger_basis, records, accounting, criticality, authority_boundaries, projection_digest]
properties:
  schema_version: {const: VERDICT_PROJECTION_V1}
  authority: {const: EVIDENCE_VERDICT_AND_CRITICALITY_PROJECTION}
  identity:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, task_id, child_ref, contract_version]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id: {type: string, minLength: 1}
      child_ref: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
  source:
    type: object
    additionalProperties: false
    required: [digest]
    properties:
      digest: {$ref: '#/$defs/digest'}
  candidate: {$ref: '#/$defs/candidate'}
  ledger_basis:
    type: object
    additionalProperties: false
    required: [evidence_source_digest, evidence_ledger_digest]
    properties:
      evidence_source_digest: {$ref: '#/$defs/digest'}
      evidence_ledger_digest: {$ref: '#/$defs/digest'}
  records:
    type: array
    items: {$ref: '#/$defs/obligation_record'}
  accounting:
    type: object
    additionalProperties: false
    required: [obligation_count, state_counts]
    properties:
      obligation_count: {type: integer, minimum: 0}
      state_counts: {$ref: '#/$defs/state_counts'}
  criticality:
    type: object
    additionalProperties: false
    required: [obligation_count, state_counts, unresolved_refuted_ids, unresolved_unknown_ids, not_applicable_ids, waiver_ids]
    properties:
      obligation_count: {type: integer, minimum: 0}
      state_counts: {$ref: '#/$defs/state_counts'}
      unresolved_refuted_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      unresolved_unknown_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      not_applicable_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      waiver_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  authority_boundaries:
    type: object
    additionalProperties: false
    required: [consumes_verdict_free_ledger, consumes_exact_evidence_evaluations, assigns_evidence_verdict, applies_criticality_policy, emits_aggregate_pass, emits_evidence_gate_decision, performs_repair_invalidation, performs_lifecycle_advance, grants_merge_authority, grants_production_cutover]
    properties:
      consumes_verdict_free_ledger: {const: true}
      consumes_exact_evidence_evaluations: {const: true}
      assigns_evidence_verdict: {const: true}
      applies_criticality_policy: {const: true}
      emits_aggregate_pass: {const: false}
      emits_evidence_gate_decision: {const: false}
      performs_repair_invalidation: {const: false}
      performs_lifecycle_advance: {const: false}
      grants_merge_authority: {const: false}
      grants_production_cutover: {const: false}
  projection_digest: {$ref: '#/$defs/digest'}
$defs:
  sha: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  candidate:
    type: object
    additionalProperties: false
    required: [repository, pr_number, ref, sha]
    properties:
      repository: {type: string, minLength: 1}
      pr_number: {type: integer, minimum: 1}
      ref: {type: string, minLength: 1}
      sha: {$ref: '#/$defs/sha'}
  evidence:
    type: object
    additionalProperties: false
    required: [evidence_id, method, candidate_sha, refs, verifier_kind, verifier_identity, evaluation_outcome, evaluation_basis_ref]
    properties:
      evidence_id: {type: string, minLength: 1}
      method: {type: string, minLength: 1}
      candidate_sha: {$ref: '#/$defs/sha'}
      refs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      verifier_kind: {type: string, minLength: 1}
      verifier_identity: {type: string, minLength: 1}
      evaluation_outcome: {type: [string, 'null'], enum: [SATISFIES, CONTRADICTS, INCONCLUSIVE, null]}
      evaluation_basis_ref: {type: [string, 'null']}
  requirement:
    type: object
    additionalProperties: false
    required: [requirement_id, method, independence, oracle_ref, state, evidence_items]
    properties:
      requirement_id: {type: string, minLength: 1}
      method: {type: string, minLength: 1}
      independence: {type: string, minLength: 1}
      oracle_ref: {type: [string, 'null']}
      state: {enum: [VERIFIED, REFUTED, UNKNOWN]}
      evidence_items:
        type: array
        items: {$ref: '#/$defs/evidence'}
  disposition:
    type: object
    additionalProperties: false
    required: [state, basis_ref, authority_kind, authority_ref, reason]
    properties:
      state: {enum: [NOT_APPLICABLE, WAIVER]}
      basis_ref: {type: string, minLength: 1}
      authority_kind: {enum: [CHILD_CONTRACT, OWNER_DECISION]}
      authority_ref: {type: string, minLength: 1}
      reason: {type: string, minLength: 1}
  obligation_record:
    type: object
    additionalProperties: false
    required: [layer, obligation_id, severity, claim_type, state, disposition, requirements]
    properties:
      layer: {enum: [L0, L1, L2]}
      obligation_id: {type: string, minLength: 1}
      severity: {enum: [CRITICAL, HIGH, NORMAL]}
      claim_type: {type: string, minLength: 1}
      state: {enum: [VERIFIED, REFUTED, UNKNOWN, NOT_APPLICABLE, WAIVER]}
      disposition:
        anyOf:
          - {type: 'null'}
          - {$ref: '#/$defs/disposition'}
      requirements:
        type: array
        items: {$ref: '#/$defs/requirement'}
  state_counts:
    type: object
    additionalProperties: false
    required: [VERIFIED, REFUTED, UNKNOWN, NOT_APPLICABLE, WAIVER]
    properties:
      VERIFIED: {type: integer, minimum: 0}
      REFUTED: {type: integer, minimum: 0}
      UNKNOWN: {type: integer, minimum: 0}
      NOT_APPLICABLE: {type: integer, minimum: 0}
      WAIVER: {type: integer, minimum: 0}
