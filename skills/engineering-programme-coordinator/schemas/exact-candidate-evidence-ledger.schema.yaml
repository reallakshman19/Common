$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-exact-candidate-evidence-ledger-v1
type: object
additionalProperties: false
required: [schema_version, authority, identity, source, candidate, manifests, denominator, records, accounting, forbidden_outcomes, non_goals, authority_boundaries, ledger_digest]
properties:
  schema_version: {const: EXACT_CANDIDATE_EVIDENCE_LEDGER_V1}
  authority: {const: CLOSED_DENOMINATOR_EVIDENCE_ACCOUNTING}
  identity:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, task_id, child_ref, contract_version]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id: {type: string, pattern: '^PRD-[A-Za-z0-9._-]+$'}
      child_ref: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
  source:
    type: object
    additionalProperties: false
    required: [kind, digest]
    properties:
      kind: {const: CLOSED_DENOMINATOR_EVIDENCE_INPUT}
      digest: {$ref: '#/$defs/digest'}
  candidate:
    type: object
    additionalProperties: false
    required: [repository, pr_number, ref, sha]
    properties:
      repository: {type: string, minLength: 1}
      pr_number: {type: integer, minimum: 1}
      ref: {type: string, minLength: 1}
      sha: {type: string, pattern: '^[0-9a-f]{40}$'}
  manifests:
    type: object
    additionalProperties: false
    required: [l0, l1, l2]
    properties:
      l0: {$ref: '#/$defs/manifest_summary'}
      l1: {$ref: '#/$defs/manifest_summary'}
      l2: {$ref: '#/$defs/manifest_summary'}
  denominator:
    type: object
    additionalProperties: false
    required: [obligation_count, requirement_count]
    properties:
      obligation_count: {type: integer, minimum: 1}
      requirement_count: {type: integer, minimum: 1}
  records:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/obligation_record'}
  accounting:
    type: object
    additionalProperties: false
    required: [obligations_with_evidence, obligations_without_evidence, requirements_with_evidence, requirements_without_evidence, evidence_item_count]
    properties:
      obligations_with_evidence: {type: integer, minimum: 0}
      obligations_without_evidence: {type: integer, minimum: 0}
      requirements_with_evidence: {type: integer, minimum: 0}
      requirements_without_evidence: {type: integer, minimum: 0}
      evidence_item_count: {type: integer, minimum: 0}
  forbidden_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  non_goals:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  authority_boundaries:
    type: object
    additionalProperties: false
    required: [consumes_obligation_manifests, consumes_exact_candidate_evidence, assigns_evidence_verdict, applies_criticality_policy, performs_repair_invalidation, performs_lifecycle_advance, grants_merge_authority, grants_production_cutover]
    properties:
      consumes_obligation_manifests: {const: true}
      consumes_exact_candidate_evidence: {const: true}
      assigns_evidence_verdict: {const: false}
      applies_criticality_policy: {const: false}
      performs_repair_invalidation: {const: false}
      performs_lifecycle_advance: {const: false}
      grants_merge_authority: {const: false}
      grants_production_cutover: {const: false}
  ledger_digest: {$ref: '#/$defs/digest'}
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  method:
    enum: [UNIT_TEST, INTEGRATION_TEST, PROPERTY_TEST, CONTRACT_TEST, STATIC_ANALYSIS, RUNTIME_TRACE, SCHEMA_CHECK, FAULT_INJECTION, MANUAL_REVIEW, OTHER]
  independence:
    enum: [PRECOMMITTED, BASELINE_DERIVED, IMPACT_DERIVED]
  manifest_summary:
    type: object
    additionalProperties: false
    required: [path, digest, obligation_count, requirement_count]
    properties:
      path: {type: string, minLength: 1}
      digest: {$ref: '#/$defs/digest'}
      obligation_count: {type: integer, minimum: 1}
      requirement_count: {type: integer, minimum: 1}
  evidence_item:
    type: object
    additionalProperties: false
    required: [evidence_id, method, candidate_sha, refs, verifier_kind, verifier_identity]
    properties:
      evidence_id: {type: string, pattern: '^EVID-[A-Za-z0-9._-]+$'}
      method: {$ref: '#/$defs/method'}
      candidate_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
      refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      verifier_kind:
        enum: [DETERMINISTIC_TOOL, FRESH_REVIEWER, SAME_PRINCIPAL_REVIEWER, EXTERNAL_REVIEWER, HUMAN_REVIEWER]
      verifier_identity: {type: string, minLength: 1}
  requirement_record:
    type: object
    additionalProperties: false
    required: [requirement_id, method, independence, oracle_ref, evidence_items]
    properties:
      requirement_id: {type: string, pattern: '^REQ-[A-Za-z0-9._-]+$'}
      method: {$ref: '#/$defs/method'}
      independence: {$ref: '#/$defs/independence'}
      oracle_ref: {type: string, minLength: 1}
      evidence_items:
        type: array
        items: {$ref: '#/$defs/evidence_item'}
  obligation_record:
    type: object
    additionalProperties: false
    required: [layer, obligation_id, severity, claim_type, requirements]
    properties:
      layer: {enum: [L0, L1, L2]}
      obligation_id: {type: string, minLength: 1}
      severity: {enum: [CRITICAL, HIGH, NORMAL]}
      claim_type: {enum: [BEHAVIOR, INVARIANT, PRESERVATION, COMPATIBILITY, AUTHORITY, IMPACT, NEGATIVE_OUTCOME]}
      requirements:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/requirement_record'}
