$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-l2-impact-obligation-manifest-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - identity
  - source
  - candidate
  - diff
  - obligations
  - forbidden_outcomes
  - non_goals
  - authority_boundaries
  - manifest_digest
properties:
  schema_version: {const: L2_IMPACT_OBLIGATION_MANIFEST_V1}
  authority: {const: DIFF_DERIVED_IMPACT_EXPECTATIONS}
  identity:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, task_id, child_ref, contract_version]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id: {type: string, pattern: '^PRD-[A-Za-z0-9._-]+$'}
      child_ref: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
  source:
    type: object
    additionalProperties: false
    required: [kind, digest]
    properties:
      kind: {const: CANDIDATE_DIFF_SELECTION_CONTRACT}
      digest: {$ref: '#/$defs/digest'}
  candidate:
    type: object
    additionalProperties: false
    required: [repository, pr_number, base_ref, base_sha, head_ref, head_sha, diff_mode]
    properties:
      repository: {type: string, minLength: 1}
      pr_number: {type: integer, minimum: 1}
      base_ref: {type: string, minLength: 1}
      base_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
      head_ref: {type: string, minLength: 1}
      head_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
      diff_mode: {const: NO_RENAMES_PATH_SET}
  diff:
    type: object
    additionalProperties: false
    required: [changed_path_count, changed_paths_digest]
    properties:
      changed_path_count: {type: integer, minimum: 0}
      changed_paths_digest: {$ref: '#/$defs/digest'}
  obligations:
    type: array
    items: {$ref: '#/$defs/obligation'}
  forbidden_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  non_goals:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  authority_boundaries:
    type: object
    additionalProperties: false
    required: [consumes_candidate_diff, consumes_implementation_evidence, consumes_coder_rationale, consumes_reviewer_verdict, emits_engineering_pass, performs_lifecycle_advance, grants_merge_authority, grants_production_cutover]
    properties:
      consumes_candidate_diff: {const: true}
      consumes_implementation_evidence: {const: false}
      consumes_coder_rationale: {const: false}
      consumes_reviewer_verdict: {const: false}
      emits_engineering_pass: {const: false}
      performs_lifecycle_advance: {const: false}
      grants_merge_authority: {const: false}
      grants_production_cutover: {const: false}
  manifest_digest: {$ref: '#/$defs/digest'}
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  method:
    enum: [UNIT_TEST, INTEGRATION_TEST, PROPERTY_TEST, CONTRACT_TEST, STATIC_ANALYSIS, RUNTIME_TRACE, SCHEMA_CHECK, FAULT_INJECTION, MANUAL_REVIEW, OTHER]
  obligation:
    type: object
    additionalProperties: false
    required: [id, severity, claim, expected_observation, plausible_green_but_wrong, oracle_refs, evidence_required, source_refs, impact_classification, matched_rule_ids, unknown_reason, diff_observation]
    properties:
      id: {type: string, pattern: '^L2-IMPACT-[0-9A-F]{12}$'}
      severity: {enum: [CRITICAL, HIGH, NORMAL]}
      claim:
        type: object
        additionalProperties: false
        required: [type, statement, subject_refs]
        properties:
          type: {const: IMPACT}
          statement: {type: string, minLength: 1}
          subject_refs:
            type: array
            minItems: 1
            maxItems: 1
            uniqueItems: true
            items: {type: string, minLength: 1}
      expected_observation: {type: string, minLength: 1}
      plausible_green_but_wrong: {type: string, minLength: 1}
      oracle_refs:
        type: array
        minItems: 1
        maxItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      evidence_required:
        type: object
        additionalProperties: false
        required: [id, method, independence, oracle_ref]
        properties:
          id: {type: string, minLength: 1}
          method: {$ref: '#/$defs/method'}
          independence: {const: IMPACT_DERIVED}
          oracle_ref: {type: string, minLength: 1}
      source_refs:
        type: array
        minItems: 1
        maxItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      impact_classification:
        enum: [KNOWN, UNKNOWN_UNMAPPED, UNKNOWN_AMBIGUOUS, UNKNOWN_STATUS]
      matched_rule_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      unknown_reason:
        type: [string, 'null']
      diff_observation:
        type: object
        additionalProperties: false
        required: [status, path]
        properties:
          status: {type: string, minLength: 1}
          path: {type: string, minLength: 1}
