$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - workstream_id
  - issue_ref
  - issued_at
  - outcome
  - boundary
  - current_inputs
  - dependencies
  - falsifier
  - success_oracle
  - expected_next_observable
  - consumers
  - semantic_escalation
  - owner_decisions
properties:
  schema_version:
    const: engineering-coordinator-work-order-v1
  kind:
    const: COORDINATOR_WORK_ORDER
  workstream_id:
    type: string
    minLength: 1
  issue_ref:
    type: string
    minLength: 1
  issued_at:
    type: string
    format: date-time
  outcome:
    type: string
    minLength: 1
  boundary:
    type: object
    additionalProperties: false
    required: [owns, excludes]
    properties:
      owns:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      excludes:
        type: array
        items: {type: string, minLength: 1}
  current_inputs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: {type: string, minLength: 1}
        digest: {type: [string, 'null']}
        observed_at: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null']}
  dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - required_output
        - why_required
        - satisfaction_evidence
        - independent_work
      properties:
        producer: {type: [string, 'null']}
        required_output: {type: string, minLength: 1}
        why_required: {type: string, minLength: 1}
        satisfaction_evidence:
          type: array
          items: {type: string, minLength: 1}
        independent_work:
          type: array
          items: {type: string, minLength: 1}
  falsifier:
    type: array
    items: {type: string, minLength: 1}
  success_oracle:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  expected_next_observable:
    type: object
    additionalProperties: false
    required: [description, evidence]
    properties:
      description: {type: string, minLength: 1}
      evidence:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
  consumers:
    type: array
    items: {type: string, minLength: 1}
  semantic_escalation:
    type: array
    items: {type: string, minLength: 1}
  owner_decisions:
    type: array
    items: {type: string, minLength: 1}
  note:
    type: [string, 'null']
