$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-review-context-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - candidate_sha
  - manifest_ref
  - manifest_digest
  - reviewer
  - context_policy
  - tool_access
properties:
  schema_version:
    const: REVIEW_CONTEXT_V1
  authority:
    const: FRESH_REVIEW_CONTEXT
  candidate_sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  manifest_ref: {type: string, minLength: 1}
  manifest_digest:
    type: string
    pattern: '^[0-9a-f]{64}$'
  reviewer:
    type: object
    additionalProperties: false
    required: [kind, identity, principal_independence, fresh_context]
    properties:
      kind:
        enum:
          - SAME_PRINCIPAL_FRESH_CONTEXT
          - DISTINCT_PRINCIPAL
          - HUMAN_REVIEWER
      identity: {type: string, minLength: 1}
      principal_independence:
        enum: [DEGRADED, DISTINCT, UNKNOWN]
      fresh_context:
        const: true
  context_policy:
    type: object
    additionalProperties: false
    required:
      - original_task_ref
      - base_sha
      - candidate_sha
      - repository_context_refs
      - candidate_visible_in_phase_a
      - generated_tests_visible_in_phase_a
      - coder_reasoning_included
      - coder_confidence_included
      - prior_self_review_included
      - implementation_rationale_included
      - candidate_visible_in_phase_b
    properties:
      original_task_ref: {type: string, minLength: 1}
      base_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
      candidate_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
      repository_context_refs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      candidate_visible_in_phase_a:
        const: false
      generated_tests_visible_in_phase_a:
        const: false
      coder_reasoning_included:
        const: false
      coder_confidence_included:
        const: false
      prior_self_review_included:
        const: false
      implementation_rationale_included:
        const: false
      candidate_visible_in_phase_b:
        const: true
  tool_access:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
