$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - issue
  - outcome
  - why_now
  - responsibility
  - canonical_inputs
  - consumers
  - dependencies
  - success_oracle
  - falsifiers
  - preserve
  - decision_surface
  - handoff_requirements
  - semantic_escalation
properties:
  schema_version:
    const: engineering-coordinator-issue-contract-v1
  authority:
    const: DURABLE_RESPONSIBILITY_CONTRACT
  issue:
    type: object
    additionalProperties: false
    required: [provider, repo, number]
    properties:
      provider: {const: GITHUB}
      repo: {type: string, minLength: 1}
      number: {type: integer, minimum: 1}
      title: {type: [string, 'null']}
  outcome:
    type: string
    minLength: 1
  why_now:
    type: object
    additionalProperties: false
    required: [summary, witnesses]
    properties:
      summary: {type: string, minLength: 1}
      witnesses:
        type: array
        items: {type: string, minLength: 1}
  responsibility:
    type: object
    additionalProperties: false
    required: [owns, excludes]
    properties:
      owns:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      excludes:
        type: array
        items: {type: string, minLength: 1}
  canonical_inputs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ref, meaning]
      properties:
        ref: {type: string, minLength: 1}
        meaning: {type: string, minLength: 1}
        source_authority: {type: [string, 'null']}
  consumers:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [target, required_output]
      properties:
        target: {type: string, minLength: 1}
        required_output:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
  dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - required_output
        - why_required
        - satisfaction_evidence
        - independent_work
      properties:
        id: {type: string, minLength: 1}
        producer: {type: [string, 'null']}
        required_output: {type: string, minLength: 1}
        why_required: {type: string, minLength: 1}
        satisfaction_evidence:
          type: array
          items: {type: string, minLength: 1}
        independent_work:
          type: array
          items: {type: string, minLength: 1}
  success_oracle:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  falsifiers:
    type: array
    items: {type: string, minLength: 1}
  preserve:
    type: array
    items: {type: string, minLength: 1}
  decision_surface:
    type: object
    additionalProperties: false
    required: [engineer, coordinator, owner]
    properties:
      engineer:
        type: array
        items: {type: string, minLength: 1}
      coordinator:
        type: array
        items: {type: string, minLength: 1}
      owner:
        type: array
        items: {type: string, minLength: 1}
  handoff_requirements:
    type: array
    items: {type: string, minLength: 1}
  semantic_escalation:
    type: array
    items: {type: string, minLength: 1}
  implementation_plan:
    type:
      - object
      - 'null'
    additionalProperties: false
    required: [provider, issue, marker, revision]
    properties:
      provider: {const: GITHUB}
      issue: {type: integer, minimum: 1}
      marker: {type: string, minLength: 1}
      revision: {type: integer, minimum: 1}
      observed_at: {type: [string, 'null'], format: date-time}
      digest: {type: [string, 'null']}
