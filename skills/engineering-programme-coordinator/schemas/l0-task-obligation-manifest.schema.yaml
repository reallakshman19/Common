$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-l0-task-obligation-manifest-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - identity
  - source
  - freeze
  - one_primary_outcome
  - obligations
  - forbidden_outcomes
  - dependency_requirements
  - non_goals
  - authority_boundaries
  - manifest_digest
properties:
  schema_version:
    const: L0_TASK_OBLIGATION_MANIFEST_V1
  authority:
    const: FROZEN_PREIMPLEMENTATION_EXPECTATIONS
  identity:
    type: object
    additionalProperties: false
    required:
      - programme_or_parent_id
      - parent_ref
      - task_id
      - child_ref
      - contract_version
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id:
        type: string
        pattern: '^PRD-[A-Za-z0-9._-]+$'
      child_ref: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
  source:
    type: object
    additionalProperties: false
    required: [kind, ref, digest]
    properties:
      kind:
        const: CHILD_CONTRACT_PROJECTION
      ref: {type: string, minLength: 1}
      digest: {$ref: '#/$defs/digest'}
  freeze:
    type: object
    additionalProperties: false
    required: [state, basis, freeze_ref]
    properties:
      state:
        const: FROZEN
      basis:
        const: CONTRACT_ONLY
      freeze_ref:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
  one_primary_outcome: {type: string, minLength: 1}
  obligations:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/obligation'}
  forbidden_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  dependency_requirements:
    type: array
    items: {$ref: '#/$defs/dependency'}
  non_goals:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  authority_boundaries:
    type: object
    additionalProperties: false
    required:
      - consumes_candidate_state
      - consumes_implementation_evidence
      - consumes_coder_rationale
      - consumes_reviewer_verdict
      - emits_engineering_pass
      - performs_lifecycle_advance
      - grants_merge_authority
      - grants_production_cutover
    properties:
      consumes_candidate_state: {const: false}
      consumes_implementation_evidence: {const: false}
      consumes_coder_rationale: {const: false}
      consumes_reviewer_verdict: {const: false}
      emits_engineering_pass: {const: false}
      performs_lifecycle_advance: {const: false}
      grants_merge_authority: {const: false}
      grants_production_cutover: {const: false}
  manifest_digest: {$ref: '#/$defs/digest'}
$defs:
  obligation:
    type: object
    additionalProperties: false
    required:
      - id
      - severity
      - claim
      - expected_observation
      - plausible_green_but_wrong
      - oracle_refs
      - evidence_required
      - source_refs
    properties:
      id: {type: string, minLength: 1}
      severity:
        enum: [CRITICAL, HIGH, NORMAL]
      claim: {$ref: '#/$defs/claim'}
      expected_observation: {type: string, minLength: 1}
      plausible_green_but_wrong: {type: string, minLength: 1}
      oracle_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      evidence_required:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/evidence_requirement'}
      source_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
  claim:
    type: object
    additionalProperties: false
    required: [type, statement, subject_refs]
    properties:
      type:
        enum:
          - BEHAVIOR
          - INVARIANT
          - PRESERVATION
          - COMPATIBILITY
          - AUTHORITY
          - NEGATIVE_OUTCOME
      statement: {type: string, minLength: 1}
      subject_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
  evidence_requirement:
    type: object
    additionalProperties: false
    required: [id, method, independence, oracle_ref]
    properties:
      id: {type: string, minLength: 1}
      method:
        enum:
          - UNIT_TEST
          - INTEGRATION_TEST
          - PROPERTY_TEST
          - CONTRACT_TEST
          - STATIC_ANALYSIS
          - RUNTIME_TRACE
          - SCHEMA_CHECK
          - FAULT_INJECTION
          - MANUAL_REVIEW
          - OTHER
      independence:
        const: PRECOMMITTED
      oracle_ref: {type: string, minLength: 1}
  dependency:
    type: object
    additionalProperties: false
    required: [producer, required_state, exact_result_ref]
    properties:
      producer: {type: string, minLength: 1}
      required_state: {type: string, minLength: 1}
      exact_result_ref: {type: string, minLength: 1}
  digest:
    type: string
    pattern: '^[0-9a-f]{64}$'
