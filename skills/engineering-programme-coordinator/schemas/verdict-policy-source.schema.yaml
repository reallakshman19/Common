$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-verdict-policy-source-v1
type: object
additionalProperties: false
required: [schema_version, authority, identity, ledger_basis, evidence_evaluations, dispositions, criticality_policy, expected_projection, forbidden_outcomes, non_goals]
properties:
  schema_version: {const: VERDICT_POLICY_SOURCE_V1}
  authority: {const: EVIDENCE_VERDICT_POLICY_INPUT}
  identity:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, task_id, child_ref, contract_version]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id: {type: string, pattern: '^PRD-[A-Za-z0-9._-]+$'}
      child_ref: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
  ledger_basis:
    type: object
    additionalProperties: false
    required: [evidence_source, evidence_ledger, candidate]
    properties:
      evidence_source: {$ref: '#/$defs/ref_digest'}
      evidence_ledger: {$ref: '#/$defs/ref_digest'}
      candidate: {$ref: '#/$defs/candidate'}
  evidence_evaluations:
    type: array
    items: {$ref: '#/$defs/evaluation'}
  dispositions:
    type: array
    items: {$ref: '#/$defs/disposition'}
  criticality_policy:
    type: object
    additionalProperties: false
    required: [critical_severity, unresolved_states, not_applicable_counts_as_verified, waiver_counts_as_verified, waiver_requires_owner_authority]
    properties:
      critical_severity: {const: CRITICAL}
      unresolved_states:
        const: [REFUTED, UNKNOWN]
      not_applicable_counts_as_verified: {const: false}
      waiver_counts_as_verified: {const: false}
      waiver_requires_owner_authority: {const: true}
  expected_projection:
    type: object
    additionalProperties: false
    required: [obligation_count, state_counts, critical, unresolved_critical_refuted, unresolved_critical_unknown, waived_critical, not_applicable_critical]
    properties:
      obligation_count: {type: integer, minimum: 0}
      state_counts: {$ref: '#/$defs/state_counts'}
      critical:
        type: object
        additionalProperties: false
        required: [obligation_count, VERIFIED, REFUTED, UNKNOWN, NOT_APPLICABLE, WAIVER]
        properties:
          obligation_count: {type: integer, minimum: 0}
          VERIFIED: {type: integer, minimum: 0}
          REFUTED: {type: integer, minimum: 0}
          UNKNOWN: {type: integer, minimum: 0}
          NOT_APPLICABLE: {type: integer, minimum: 0}
          WAIVER: {type: integer, minimum: 0}
      unresolved_critical_refuted: {type: integer, minimum: 0}
      unresolved_critical_unknown: {type: integer, minimum: 0}
      waived_critical: {type: integer, minimum: 0}
      not_applicable_critical: {type: integer, minimum: 0}
  forbidden_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  non_goals:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
$defs:
  sha: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  ref_digest:
    type: object
    additionalProperties: false
    required: [path, digest]
    properties:
      path: {type: string, minLength: 1}
      digest: {$ref: '#/$defs/digest'}
  candidate:
    type: object
    additionalProperties: false
    required: [repository, pr_number, ref, sha]
    properties:
      repository: {type: string, minLength: 1}
      pr_number: {type: integer, minimum: 1}
      ref: {type: string, minLength: 1}
      sha: {$ref: '#/$defs/sha'}
  evaluation:
    type: object
    additionalProperties: false
    required: [evidence_id, requirement_id, candidate_sha, outcome, basis_ref]
    properties:
      evidence_id: {type: string, pattern: '^EVID-[A-Za-z0-9._-]+$'}
      requirement_id: {type: string, minLength: 1}
      candidate_sha: {$ref: '#/$defs/sha'}
      outcome: {enum: [SATISFIES, CONTRADICTS, INCONCLUSIVE]}
      basis_ref: {type: string, minLength: 1}
  disposition:
    type: object
    additionalProperties: false
    required: [obligation_id, state, basis_ref, authority_kind, authority_ref, reason]
    properties:
      obligation_id: {type: string, minLength: 1}
      state: {enum: [NOT_APPLICABLE, WAIVER]}
      basis_ref: {type: string, minLength: 1}
      authority_kind: {enum: [CHILD_CONTRACT, OWNER_DECISION]}
      authority_ref: {type: string, minLength: 1}
      reason: {type: string, minLength: 1}
  state_counts:
    type: object
    additionalProperties: false
    required: [VERIFIED, REFUTED, UNKNOWN, NOT_APPLICABLE, WAIVER]
    properties:
      VERIFIED: {type: integer, minimum: 0}
      REFUTED: {type: integer, minimum: 0}
      UNKNOWN: {type: integer, minimum: 0}
      NOT_APPLICABLE: {type: integer, minimum: 0}
      WAIVER: {type: integer, minimum: 0}
