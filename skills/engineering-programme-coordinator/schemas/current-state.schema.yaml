$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-current-state-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - parent
  - active
  - candidate
  - frontiers
  - dependencies
  - open_critical_findings
  - open_critical_unknowns
  - stale_evidence
  - production
  - merge_authority
  - next_action
  - forbidden_next_actions
  - source_refs
properties:
  schema_version:
    const: CURRENT_STATE_V1
  authority:
    const: CURRENT_STATE_PROJECTION
  parent:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, parent_contract_version, main_sha]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      parent_contract_version: {type: string, minLength: 1}
      main_sha: {$ref: '#/$defs/sha'}
  active:
    type: object
    additionalProperties: false
    required: [phase, prd_id, issue_ref, role, attempt]
    properties:
      phase: {type: string, minLength: 1}
      prd_id:
        type: string
        pattern: '^PRD-[A-Za-z0-9._-]+$'
      issue_ref: {type: string, minLength: 1}
      role:
        enum: [CODER, REVIEWER, COORDINATOR, NONE]
      attempt: {type: integer, minimum: 1}
  candidate:
    type: object
    additionalProperties: false
    required: [state, pr, branch, base_sha, head_sha, changed_files]
    properties:
      state:
        enum: [NONE, ACTIVE]
      pr: {type: [integer, 'null'], minimum: 1}
      branch: {type: [string, 'null']}
      base_sha:
        anyOf:
          - {type: 'null'}
          - {$ref: '#/$defs/sha'}
      head_sha:
        anyOf:
          - {type: 'null'}
          - {$ref: '#/$defs/sha'}
      changed_files:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  frontiers:
    type: object
    additionalProperties: false
    required: [material, semantic, evidence]
    properties:
      material: {type: string, minLength: 1}
      semantic: {type: string, minLength: 1}
      evidence: {type: string, minLength: 1}
  dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - producer
        - required_state
        - observed_state
        - evidence_ref
        - exact_result_ref
      properties:
        producer: {type: string, minLength: 1}
        required_state: {type: string, minLength: 1}
        observed_state:
          enum: [VERIFIED, WAITING, REFUTED, UNKNOWN]
        evidence_ref: {type: [string, 'null']}
        exact_result_ref: {type: [string, 'null']}
  open_critical_findings:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  open_critical_unknowns:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  stale_evidence:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  production:
    type: object
    additionalProperties: false
    required: [mode, authority_ref]
    properties:
      mode:
        enum: ['OFF', 'SHADOW_ONLY', 'CRITICAL_GATE', 'DEFAULT_GATE']
      authority_ref: {type: [string, 'null']}
  merge_authority:
    type: object
    additionalProperties: false
    required: [state, authority_ref]
    properties:
      state:
        enum: [NOT_GRANTED, OWNER_GRANTED]
      authority_ref: {type: [string, 'null']}
  next_action:
    type: object
    additionalProperties: false
    required:
      - execution_state_ref
      - execution_state_digest
      - type
      - reason_code
      - basis_refs
    properties:
      execution_state_ref: {type: string, minLength: 1}
      execution_state_digest: {$ref: '#/$defs/digest'}
      type:
        enum:
          - STOPPED
          - RECONCILE
          - WAIT_DEPENDENCY
          - IMPLEMENT
          - VERIFY_CANDIDATE
          - REPAIR_CANDIDATE
          - ESCALATE
          - REQUEST_STAGE_ADVANCE
      reason_code:
        enum:
          - STATE_CONTRADICTION
          - LIFECYCLE_STOPPED
          - BLOCKED_DEPENDENCY
          - CAPABILITY_UNVERIFIED
          - ACTIVE_ROLE_MISSING
          - IMPLEMENTATION_REQUIRED
          - VERIFICATION_REQUIRED
          - REPAIR_REQUIRED
          - CRITICAL_UNKNOWN
          - GATE_REQUIRED
          - GATE_REPLAY
          - GATE_REPAIR
          - GATE_ESCALATE
          - ADVANCEMENT_ELIGIBLE
          - CAPABILITY_MISSING
      basis_refs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
  forbidden_next_actions:
    type: array
    uniqueItems: true
    items:
      enum:
        - STOPPED
        - RECONCILE
        - WAIT_DEPENDENCY
        - IMPLEMENT
        - VERIFY_CANDIDATE
        - REPAIR_CANDIDATE
        - ESCALATE
        - REQUEST_STAGE_ADVANCE
  source_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
$defs:
  sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  digest:
    type: string
    pattern: '^[0-9a-f]{64}$'
