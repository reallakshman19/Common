$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-exact-candidate-evidence-source-v1
type: object
additionalProperties: false
required: [schema_version, authority, identity, candidate, manifests, evidence_items, forbidden_outcomes, non_goals]
properties:
  schema_version: {const: EXACT_CANDIDATE_EVIDENCE_SOURCE_V1}
  authority: {const: CLOSED_DENOMINATOR_EVIDENCE_INPUT}
  identity:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, task_id, child_ref, contract_version]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id: {type: string, pattern: '^PRD-[A-Za-z0-9._-]+$'}
      child_ref: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
  candidate:
    type: object
    additionalProperties: false
    required: [repository, pr_number, ref, sha]
    properties:
      repository: {type: string, minLength: 1}
      pr_number: {type: integer, minimum: 1}
      ref: {type: string, minLength: 1}
      sha: {type: string, pattern: '^[0-9a-f]{40}$'}
  manifests:
    type: object
    additionalProperties: false
    required: [l0, l1, l2]
    properties:
      l0: {$ref: '#/$defs/manifest_ref'}
      l1: {$ref: '#/$defs/manifest_ref'}
      l2: {$ref: '#/$defs/manifest_ref'}
  evidence_items:
    type: array
    items: {$ref: '#/$defs/evidence_item'}
  forbidden_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  non_goals:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  method:
    enum: [UNIT_TEST, INTEGRATION_TEST, PROPERTY_TEST, CONTRACT_TEST, STATIC_ANALYSIS, RUNTIME_TRACE, SCHEMA_CHECK, FAULT_INJECTION, MANUAL_REVIEW, OTHER]
  manifest_ref:
    type: object
    additionalProperties: false
    required: [path, digest]
    properties:
      path: {type: string, minLength: 1}
      digest: {$ref: '#/$defs/digest'}
  evidence_item:
    type: object
    additionalProperties: false
    required: [evidence_id, requirement_id, method, candidate_sha, refs, verifier_kind, verifier_identity]
    properties:
      evidence_id: {type: string, pattern: '^EVID-[A-Za-z0-9._-]+$'}
      requirement_id: {type: string, pattern: '^REQ-[A-Za-z0-9._-]+$'}
      method: {$ref: '#/$defs/method'}
      candidate_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
      refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      verifier_kind:
        enum: [DETERMINISTIC_TOOL, FRESH_REVIEWER, SAME_PRINCIPAL_REVIEWER, EXTERNAL_REVIEWER, HUMAN_REVIEWER]
      verifier_identity: {type: string, minLength: 1}
