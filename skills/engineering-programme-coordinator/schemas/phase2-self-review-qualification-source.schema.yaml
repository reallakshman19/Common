$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-phase2-self-review-qualification-source-v1
type: object
additionalProperties: false
required: [schema_version, authority, identity, target, retained_artifacts, qualification_cases, expected_qualification, authority_boundaries, forbidden_outcomes, non_goals]
properties:
  schema_version: {const: PHASE2_SELF_REVIEW_QUALIFICATION_SOURCE_V1}
  authority: {const: PHASE2_SELF_REVIEW_QUALIFICATION_INPUT}
  identity:
    type: object
    additionalProperties: false
    required: [programme_or_parent_id, parent_ref, task_id, child_ref, contract_version]
    properties:
      programme_or_parent_id: {type: string, minLength: 1}
      parent_ref: {type: string, minLength: 1}
      task_id: {const: PRD-527-P2-I}
      child_ref: {const: SELF:PRD-527-P2-I}
      contract_version: {const: P2-I-v1}
  target:
    type: object
    additionalProperties: false
    required: [repository, ref, sha]
    properties:
      repository: {const: reallaksh19/Common}
      ref: {const: main}
      sha: {$ref: '#/$defs/sha'}
  retained_artifacts:
    type: object
    additionalProperties: false
    required: [l0, l1, l2, evidence, repair, verdict]
    properties:
      l0: {$ref: '#/$defs/source_manifest_pair'}
      l1: {$ref: '#/$defs/source_manifest_pair'}
      l2: {$ref: '#/$defs/source_manifest_pair'}
      evidence:
        type: object
        additionalProperties: false
        required: [source_path, source_digest, ledger_path, ledger_digest]
        properties:
          source_path: {$ref: '#/$defs/path'}
          source_digest: {$ref: '#/$defs/digest'}
          ledger_path: {$ref: '#/$defs/path'}
          ledger_digest: {$ref: '#/$defs/digest'}
      repair:
        type: object
        additionalProperties: false
        required: [source_path, source_digest, expected_result_digest]
        properties:
          source_path: {$ref: '#/$defs/path'}
          source_digest: {$ref: '#/$defs/digest'}
          expected_result_digest: {$ref: '#/$defs/digest'}
      verdict:
        type: object
        additionalProperties: false
        required: [source_path, source_digest, expected_projection_digest]
        properties:
          source_path: {$ref: '#/$defs/path'}
          source_digest: {$ref: '#/$defs/digest'}
          expected_projection_digest: {$ref: '#/$defs/digest'}
  qualification_cases:
    type: array
    minItems: 7
    maxItems: 7
    items: {$ref: '#/$defs/case'}
  expected_qualification:
    type: object
    additionalProperties: false
    required: [clean_controls, seeded_green_but_wrong, seeded_detected, seeded_missed, clean_false_blocks, stages_covered]
    properties:
      clean_controls: {const: 1}
      seeded_green_but_wrong: {const: 6}
      seeded_detected: {const: 6}
      seeded_missed: {const: 0}
      clean_false_blocks: {const: 0}
      stages_covered:
        const: [P2-S1, P2-S2, P2-S3, P2-S4, P2-S5, P2-S6]
  authority_boundaries:
    type: object
    additionalProperties: false
    required: [consumes_retained_real_artifacts, applies_seed_overlays_in_memory_only, mutates_retained_artifacts, emits_engineering_pass, emits_evidence_gate_decision, performs_lifecycle_advance, grants_merge_authority, grants_production_cutover]
    properties:
      consumes_retained_real_artifacts: {const: true}
      applies_seed_overlays_in_memory_only: {const: true}
      mutates_retained_artifacts: {const: false}
      emits_engineering_pass: {const: false}
      emits_evidence_gate_decision: {const: false}
      performs_lifecycle_advance: {const: false}
      grants_merge_authority: {const: false}
      grants_production_cutover: {const: false}
  forbidden_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  non_goals:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
$defs:
  sha: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  path: {type: string, minLength: 1}
  source_manifest_pair:
    type: object
    additionalProperties: false
    required: [source_path, source_digest, manifest_path, manifest_digest]
    properties:
      source_path: {$ref: '#/$defs/path'}
      source_digest: {$ref: '#/$defs/digest'}
      manifest_path: {$ref: '#/$defs/path'}
      manifest_digest: {$ref: '#/$defs/digest'}
  case:
    type: object
    additionalProperties: false
    required: [id, kind, stage, mutation, shallow_signal, expected_detector, expected_outcome]
    properties:
      id: {type: string, minLength: 1}
      kind: {enum: [CLEAN_CONTROL, SEEDED_GREEN_BUT_WRONG]}
      stage: {enum: [ALL, P2-S1, P2-S2, P2-S3, P2-S4, P2-S5, P2-S6]}
      mutation: {type: string, minLength: 1}
      shallow_signal: {enum: [RETAINED_REAL_ARTIFACTS, SCHEMA_AND_SELF_DIGEST_GREEN]}
      expected_detector: {type: string, minLength: 1}
      expected_outcome: {enum: [REPLAY_CLEAN, REJECTED]}
