$schema: https://json-schema.org/draft/2020-12/schema
$id: engineering-programme-coordinator-production-readiness-v1
type: object
additionalProperties: false
required:
  - schema_version
  - authority
  - target
  - exact_basis
  - components
  - production_mode
  - cutover_authorization
  - cutover_blockers
  - non_blocking_residuals
  - deferred_research
properties:
  schema_version:
    const: PRODUCTION_READINESS_V1
  authority:
    const: PRODUCTION_READINESS_PROJECTION
  target:
    type: object
    additionalProperties: false
    required: [local_runtime, coder_runtime, coordinator, common_reviewer]
    properties:
      local_runtime: {type: string, minLength: 1}
      coder_runtime: {type: string, minLength: 1}
      coordinator: {type: string, minLength: 1}
      common_reviewer: {type: string, minLength: 1}
  exact_basis:
    type: object
    additionalProperties: false
    required:
      - target_ref
      - target_sha
      - local_protocol_ref
      - local_protocol_digest
      - v35_protocol_ref
      - v35_protocol_digest
      - common_reviewer_ref
      - common_reviewer_digest
    properties:
      target_ref: {type: string, minLength: 1}
      target_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
      local_protocol_ref:
        type: string
        pattern: '^[^@\s]+@[0-9a-f]{40}:.+$'
      local_protocol_digest:
        type: string
        pattern: '^[0-9a-f]{64}$'
      v35_protocol_ref:
        type: string
        pattern: '^[^@\s]+@[0-9a-f]{40}:.+$'
      v35_protocol_digest:
        type: string
        pattern: '^[0-9a-f]{64}$'
      common_reviewer_ref:
        type: string
        pattern: '^[^@\s]+@[0-9a-f]{40}:.+$'
      common_reviewer_digest:
        type: string
        pattern: '^[0-9a-f]{64}$'
  components:
    type: object
    additionalProperties: false
    required:
      - canonical_local_projection
      - active_authority_resolution
      - activation_state_derivation
      - role_succession_semantics
      - acceptance_denominator_closure
      - reviewer_definition
      - real_artifact_horizontal_integration
      - exact_candidate_verification
      - provider_idempotency
      - execution_kernel
      - proof_obligation_runtime
      - evidence_gate
      - shadow_rollout
      - rollback
    properties:
      canonical_local_projection: {$ref: '#/$defs/component'}
      active_authority_resolution: {$ref: '#/$defs/component'}
      activation_state_derivation: {$ref: '#/$defs/component'}
      role_succession_semantics: {$ref: '#/$defs/component'}
      acceptance_denominator_closure: {$ref: '#/$defs/component'}
      reviewer_definition: {$ref: '#/$defs/component'}
      real_artifact_horizontal_integration: {$ref: '#/$defs/component'}
      exact_candidate_verification: {$ref: '#/$defs/component'}
      provider_idempotency: {$ref: '#/$defs/component'}
      execution_kernel: {$ref: '#/$defs/component'}
      proof_obligation_runtime: {$ref: '#/$defs/component'}
      evidence_gate: {$ref: '#/$defs/component'}
      shadow_rollout: {$ref: '#/$defs/component'}
      rollback: {$ref: '#/$defs/component'}
  production_mode:
    enum: ['OFF', 'SHADOW_ONLY', 'CRITICAL_GATE', 'DEFAULT_GATE']
  cutover_authorization:
    type: object
    additionalProperties: false
    required: [authorized, authorized_mode, authority_ref, authorized_at]
    properties:
      authorized: {type: boolean}
      authorized_mode:
        enum: [null, SHADOW_ONLY, CRITICAL_GATE, DEFAULT_GATE]
      authority_ref: {type: [string, 'null']}
      authorized_at: {type: [string, 'null'], format: date-time}
  cutover_blockers:
    type: array
    items: {$ref: '#/$defs/blocker'}
  non_blocking_residuals:
    type: array
    items: {type: string, minLength: 1}
  deferred_research:
    type: array
    items: {type: string, minLength: 1}
$defs:
  component:
    type: object
    additionalProperties: false
    required: [state, evidence_refs]
    properties:
      state:
        enum:
          - VERIFIED
          - REFUTED
          - UNKNOWN
          - NOT_APPLICABLE
          - NOT_IMPLEMENTED
          - SHADOW_ONLY
          - CONDITIONALLY_QUALIFIED
      evidence_refs:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      note:
        type: [string, 'null']
  blocker:
    type: object
    additionalProperties: false
    required: [id, severity, state, reason, evidence_refs]
    properties:
      id: {type: string, minLength: 1}
      severity: {enum: [HARD, SOFT]}
      state: {enum: [OPEN, RESOLVED]}
      reason: {type: string, minLength: 1}
      evidence_refs:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
