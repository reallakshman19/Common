# Stress test workload fixture mapping and classification contract.
#
# NOTE: decompose_v36.py requires a strict plan format. The actual 300 tasks are defined
# in skills/engineering-pr-delivery-v3.6/plans/V36-8-PLAN-01.yaml under Parent Issue #8.
# This specification defines the parser outcome classification contract for snapshot_v36.py.

workload_id: "V36-LOAD-FIXTURE-300"
workload_plan_path: "skills/engineering-pr-delivery-v3.6/plans/V36-8-PLAN-01.yaml"
workload_parent: "reallakshman19/relay-v36-stress-lab#8"
controlling_parent: "reallakshman19/relay-v36-stress-lab#1"
controlling_stage: "V36-1-ST02"
target_scale: 300

# Strict parser classification contract mapped to snapshot_v36.py states:
evidence_classification_matrix:
  positive_controls:
    count: 300
    expected_status: "CURRENT_EVIDENCE"
    proof_url_pattern: "https://github.com/reallakshman19/relay-v36-stress-lab/pull/<PR>"
    candidate_pattern: "reallakshman19/relay-v36-stress-lab@<LIVE_PR_HEAD_SHA>"
    tests_pattern: "84/84"
    actor_requirement: "Must match repository owner (reallakshman19)"
    notes: "Evidence confirms candidate test state; NEVER implies Owner final delivery acceptance."

  negative_controls:
    total_count: 150
    subsets:
      stale_pr_head:
        count: 50
        expected_status: "STALE_EVIDENCE"
        description: "Valid 8 lines and proof PR, but PR head has moved past candidate SHA"
      commit_proof_url:
        count: 50
        expected_status: "UNVERIFIED_PROOF"
        description: "Proof URL uses /commit/<sha> instead of /pull/<pr>; proof_pr() returns None"
      proof_commit_mismatch:
        count: 50
        expected_status: "UNVERIFIED_PROOF"
        description: "Proof URL uses /pull/<pr>/commits/<sha1> where sha1 differs from candidate sha2"

  adversarial_controls:
    total_count: 150
    subsets:
      foreign_author:
        count: 50
        expected_status: "INVALID_EVIDENCE"
        description: "Comment authored by actor other than repository owner"
      malformed_format:
        count: 40
        expected_status: "INVALID_EVIDENCE"
        description: "Missing required headers, unresolved placeholders, or invalid test counts"
      task_outcome_mismatch:
        count: 30
        expected_status: "INVALID_EVIDENCE"
        description: "Comment declares outcome or task ID differing from task declaration"
      nonexistent_pr:
        count: 30
        expected_status: "UNKNOWN_PR"
        description: "Proof URL references PR number that does not exist in repository"
