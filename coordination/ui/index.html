<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <title>Control Tower Cockpit v3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <header id="topbar">
    <div class="logo">
      <span class="logo-badge">CT-v3</span>
      <div class="logo-text">
        <span class="title">Control Tower</span>
        <span class="chip" id="modeChip">INITIALIZING</span>
      </div>
    </div>

    <div class="bar-right">
      <select id="projSelect" class="proj-select" title="Switch project">
        <option value="">All Projects</option>
      </select>

      <div class="search-wrap">
        <span class="si">🔍</span>
        <input id="globalSearch" type="text" placeholder="Filter view...">
      </div>

      <button class="btn btn-primary" id="refreshBtn">⟳ Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle theme">🌓</button>

      <div class="status-pill" id="statusPill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking status…</span>
      </div>
    </div>
  </header>

  <!-- Telemetry Bar -->
  <div id="telemetryBar" class="telemetry-bar">
    <div class="telemetry-item" id="telMode">Mode: Detecting…</div>
    <div class="telemetry-item" id="telGeneration">Generation: –</div>
    <div class="telemetry-item" id="telAsOf">Source as-of: –</div>
    <div class="telemetry-item" id="telStaleness">Freshness: –</div>
  </div>

  <!-- Nav tabs -->
  <nav id="navtabs">
    <div class="ntab active" data-view="portfolio">🏢 Portfolio <span class="cnt" id="cnt-portfolio">–</span></div>
    <div class="ntab" data-view="works">📦 Works <span class="cnt" id="cnt-works">–</span></div>
    <div class="ntab" data-view="assignments">📋 Assignments <span class="cnt" id="cnt-assignments">–</span></div>
    <div class="ntab" data-view="evidence">🧾 Evidence <span class="cnt" id="cnt-evidence">–</span></div>
    <div class="ntab" data-view="recovery">🛡️ Recovery <span class="cnt" id="cnt-recovery">–</span></div>
    <div class="ntab" data-view="unassigned" id="tabUnassigned" style="display: none;">⚠️ Unassigned <span class="cnt" id="cnt-unassigned">–</span></div>
  </nav>

  <!-- Main layout -->
  <main id="main">
    <div id="content" role="main">
      <div class="loading-spinner" id="loadingSpinner">Loading Control Tower projections…</div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
