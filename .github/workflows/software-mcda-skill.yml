name: Software MCDA and Workflow Intelligence — offline skill tests

on:
  pull_request:
    paths:
      - 'skills/software-mcda/**'
      - 'skills/workflow-intelligence/**'
      - '.github/workflows/software-mcda-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: |
          python -m py_compile skills/software-mcda/scripts/mcda.py
          python -m py_compile skills/workflow-intelligence/scripts/observe.py
          python -m py_compile skills/workflow-intelligence/scripts/state.py
          python -m py_compile skills/workflow-intelligence/scripts/decision_gate.py
          python -m py_compile skills/workflow-intelligence/scripts/github_check_facts.py
          python -m py_compile skills/workflow-intelligence/scripts/monitor_handoff.py
          python -m py_compile skills/workflow-intelligence/scripts/restore_previous.py
          python -m py_compile skills/workflow-intelligence/scripts/invoke.py
      - name: Test standalone MCDA
        run: python -m unittest discover -s skills/software-mcda/tests -v
      - name: Test read-only observation adapter
        run: python -m unittest discover -s skills/workflow-intelligence/tests -v
      - name: Smoke test JSON results
        run: |
          python skills/software-mcda/scripts/mcda.py skills/software-mcda/assets/example-decision.json --sensitivity cost=0.50 --break-even cost --format json > /tmp/mcda.json
          python -m json.tool /tmp/mcda.json > /dev/null
      - name: Smoke test disabled decision and state replay
        run: |
          python skills/workflow-intelligence/scripts/decision_gate.py --request skills/workflow-intelligence/examples/decision-request.disabled.json --output /tmp/assessment.json
          python skills/workflow-intelligence/scripts/state.py --current skills/workflow-intelligence/examples/monitor-snapshot.json --assessment /tmp/assessment.json --state-output /tmp/uwi-state.json --events-output /tmp/uwi-first.json
          python skills/workflow-intelligence/scripts/state.py --current skills/workflow-intelligence/examples/monitor-snapshot.json --assessment /tmp/assessment.json --previous-state /tmp/uwi-state.json --state-output /tmp/uwi-state-2.json --events-output /tmp/uwi-repeat.json
          python -c 'import json; a=json.load(open("/tmp/assessment.json")); b=json.load(open("/tmp/uwi-first.json")); c=json.load(open("/tmp/uwi-repeat.json")); assert a["status"] == "NOT_EVALUATED"; assert not a["notification_eligible"]; assert b["events"] == c["events"] == []'
      - name: Smoke test disabled GitHub fact reader without token
        run: |
          python skills/workflow-intelligence/scripts/github_check_facts.py --request skills/workflow-intelligence/examples/github-checks.disabled.json --output /tmp/github-facts.json
          python -c 'import json; d=json.load(open("/tmp/github-facts.json")); assert d["status"] == "DISABLED"; assert not d["eligible_for_mcda_rating"]; assert not d["notification_eligible"]; assert not d["checks"]'
      - name: Smoke test single-artifact monitor handoff with explicit bootstrap and replay
        run: |
          python skills/workflow-intelligence/scripts/monitor_handoff.py --monitor-current skills/workflow-intelligence/examples/monitor-snapshot.json --bootstrap --output-artifact /tmp/uwi-handoff-first.json
          python skills/workflow-intelligence/scripts/monitor_handoff.py --monitor-current skills/workflow-intelligence/examples/monitor-snapshot.json --previous-artifact /tmp/uwi-handoff-first.json --output-artifact /tmp/uwi-handoff-repeat.json
          python -c 'import json; a=json.load(open("/tmp/uwi-handoff-first.json")); b=json.load(open("/tmp/uwi-handoff-repeat.json")); assert a["events"] == b["events"] == []; assert a["state_digest"] == b["state_digest"]; assert a["mode"] == "DIAGNOSTIC_ONLY"'
      - name: Smoke test skill invocation monitoring defaults OFF
        run: |
          python skills/workflow-intelligence/scripts/invoke.py --decision skills/software-mcda/assets/example-decision.json > /tmp/uwi-invocation-off.json
          python -c 'import json; x=json.load(open("/tmp/uwi-invocation-off.json")); assert x["monitoring"]["mode"] == "off"; assert x["monitoring"]["status"] == "SKIPPED"; assert not x["monitoring"]["scheduled_monitoring_changed"]; assert x["mcda"]["result"]["original"]["winner"] == "Rewrite From Scratch"'
      - name: Smoke test ON refuses disabled sample and makes no provider read
        run: |
          if python skills/workflow-intelligence/scripts/invoke.py --monitor on --workflow-id sample-buddyrunner --workflow-config skills/universal-workflow-progress/config/workflows.json > /tmp/should-not-pass.json; then
            echo "ERROR: Disabled sample workflow unexpectedly activated" >&2
            exit 1
          fi
