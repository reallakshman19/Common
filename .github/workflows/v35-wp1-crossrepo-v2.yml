name: WP1 read-only cross-repository identity checks
on:
  pull_request:
    paths:
      - 'skills/engineering-relay-v1/lifecycle-v35/cross_repository_identity_v2.py'
      - 'skills/engineering-relay-v1/lifecycle-v35/test_cross_repository*_v2.py'
      - 'skills/engineering-relay-v1/lifecycle-v35/cross_repository_provider_v2.py'
      - 'skills/engineering-relay-v1/schemas/lifecycle-v35/cross-repository-identity-v2.schema.json'
      - '.github/workflows/v35-wp1-crossrepo-v2.yml'
permissions:
  contents: read
jobs:
  identity-v2:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install jsonschema
      - name: Verify exact candidate and run native Python tests
        shell: bash
        run: |
          git rev-parse HEAD
          python -m unittest discover -s skills/engineering-relay-v1/lifecycle-v35 -p 'test_cross_repository*_v2.py' -v
