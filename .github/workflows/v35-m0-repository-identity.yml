name: V3.5 M0 repository reference conformance
on:
  pull_request:
    paths:
      - 'relay/MIGRATIONS/V35_COMMON_CUTOVER_20261009/**'
      - '.github/workflows/v35-m0-repository-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-migration-reference:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact tested source
        shell: bash
        run: |
          git rev-parse HEAD
          git status --porcelain
      - name: Run M0 reference-only positive and adversarial tests
        shell: bash
        run: node --test relay/MIGRATIONS/V35_COMMON_CUTOVER_20261009/*.test.mjs

  live-provider-object-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact tested source
        run: git rev-parse HEAD
      - name: Double-read live moving PR heads, immutable origin refs, provider identity and ancestry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node relay/MIGRATIONS/V35_COMMON_CUTOVER_20261009/observe-moving-heads-v1.cli.mjs
