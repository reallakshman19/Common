name: BuddyRunner v2.0 relay and onboarding
on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/buddy-runner-v2-0/**'
      - '.github/workflows/buddy-runner-v20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing native validator dependencies
        run: python -m pip install 'PyYAML>=6.0,<7.0' 'jsonschema>=4.18,<5'
      - name: Run v2.0 behavioral and pinned-native tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s skills/buddy-runner-v2-0/tests -p 'test_*.py' -v
      - name: Prepare onboarding without dispatch
        run: python skills/buddy-runner-v2-0/scripts/buddy_runner_v20.py --input skills/buddy-runner-v2-0/examples/onboard.json --record skills/buddy-runner-v2-0/examples/reconstruction.json --status-json
