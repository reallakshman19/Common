name: v32-325-generic-source-preflight-readonly

on:
  pull_request:
    paths:
      - 'relay/INTEGRATION/V32_325_GENERIC_SOURCE_20261011/**'
      - '.github/workflows/v32-325-generic-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native DELP schema runtime
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Compile the new non-frozen preflight and tests
        run: python -m compileall -q relay/INTEGRATION/V32_325_GENERIC_SOURCE_20261011
      - name: Run real native V3.2 graph/project seam with synthetic GET-only provider
        run: |
          python -m unittest discover -s relay/INTEGRATION/V32_325_GENERIC_SOURCE_20261011 -p 'test_*.py' -v
      - name: Verify source boundary has no external GitHub writer calls
        run: |
          if grep -En '(gh[[:space:]]+api|subprocess|requests\.|urllib\.|patch_issue|patch_pull|post_comment|PATCH|POST)' relay/INTEGRATION/V32_325_GENERIC_SOURCE_20261011/generic_source_preflight.py; then
            echo 'GET-only preflight must not own a transport or mutation call' >&2
            exit 1
          fi
