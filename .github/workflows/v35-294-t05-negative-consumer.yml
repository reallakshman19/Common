name: "V3.5 #294 T05 same-head WP2-A to WP2-B native negative consumer"

on:
  pull_request:
    paths:
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/**'
      - 'relay/RECOVERY/V35_R14_WP2B_20261010/**'
      - '.github/workflows/v35-294-t05-negative-consumer.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  same-head-consumer-negatives:
    name: T05 actual U04-B03 source tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify one tested HEAD plus original U02/U03/U04 and WP2-B blobs
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          cd relay/RECOVERY
          test "$(git hash-object V35_R14_WP2A_20261010/required-ci-material-v1.mjs)" = "9eeb0413805919720535b1180ac47f1e6e54b254"
          test "$(git hash-object V35_R14_WP2A_20261010/required-ci-material-v1.test.mjs)" = "64d4175d6293b3e39d82ce0d5d56d20e4657a2b0"
          test "$(git hash-object V35_R14_WP2A_20261010/task-evidence-comment-v1.mjs)" = "79cffd2e3d2828ac1727afad7763267768c56ad5"
          test "$(git hash-object V35_R14_WP2A_20261010/task-evidence-comment-v1.test.mjs)" = "fb06f9360f5f72d12469c84ba933c282bc0ed3d8"
          test "$(git hash-object V35_R14_WP2A_20261010/cross-source-vector-v1.mjs)" = "53b078341ef32839e8fdbf26ad7cbea0f9a3cc9a"
          test "$(git hash-object V35_R14_WP2A_20261010/cross-source-vector-v1.test.mjs)" = "ec9f2d4b9e563ff2994bde0b859ab83dc46b5eeb"
          test "$(git hash-object V35_R14_WP2B_20261010/pre-admission-boundary-v1.mjs)" = "5b5be81045e9fbb4f2fbd2a5ff79d44baf33a594"
          test "$(git hash-object V35_R14_WP2B_20261010/pre-admission-boundary-v1.test.mjs)" = "6c9882753df4cc55a63b0c7071f89422f8c9bc94"
          test "$(git hash-object V35_R14_WP2A_20261010/t05-native-source-failure-v1.mjs)" = "fce23e43f95903ae1cc01702d592a50d51c66233"
          test "$(git hash-object V35_R14_WP2A_20261010/t05-native-wp2b-negative.cli.mjs)" = "7c7c39b18b217bf94444dcbaa79c3ecd5f571e3b"
          test "$(git hash-object V35_R14_WP2A_20261010/t05-wp2b-same-head.test.mjs)" = "8e8fcb84b94850b87670c4501f8a80c38a362659"
      - name: Inherited WP2-B B01–B03 adversarial tests
        shell: bash
        run: node --test relay/RECOVERY/V35_R14_WP2B_20261010/pre-admission-boundary-v1.test.mjs
      - name: Same-head injected historical U04 -> unchanged WP2-B refusal tests
        shell: bash
        run: node --test relay/RECOVERY/V35_R14_WP2A_20261010/t05-wp2b-same-head.test.mjs

  native-negative-consumer:
    name: T05 real GitHub U04 to B03 (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.repository == 'reallakshman19/Common' && github.event.pull_request.head.repo.full_name == 'reallakshman19/Common'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-head genuine WP2-A native provider to WP2-B original consumer, no admission
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2B_20261010/pre-admission-boundary-v1.mjs)" = "5b5be81045e9fbb4f2fbd2a5ff79d44baf33a594"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2A_20261010/t05-native-source-failure-v1.mjs)" = "fce23e43f95903ae1cc01702d592a50d51c66233"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2A_20261010/t05-native-wp2b-negative.cli.mjs)" = "7c7c39b18b217bf94444dcbaa79c3ecd5f571e3b"
          node relay/RECOVERY/V35_R14_WP2A_20261010/t05-native-wp2b-negative.cli.mjs
