name: Oracle continuity

on:
  pull_request:
    paths:
      - 'skills/agent-work/oracle-continuity/**'
      - 'skills/agent-work/START_HERE.md'
      - 'skills/agent-work/ENTRY_PROCESS_MAPS.md'
      - 'skills/agent-work/ROLE_LIFECYCLE.md'
      - 'skills/agent-work/oracle-standalone/SKILL.md'
      - 'skills/agent-work/oracle-standalone/references/CHANGEOVER.md'
      - 'skills/agent-work/oracle-standalone/references/PROGRESS_ADAPTER.md'
      - 'skills/agent-work/oracle-standalone/references/ORACLE_HANDOVER_PROTOCOL.md'
      - 'skills/agent-work/progress-page/references/MODES.md'
      - 'skills/agent-work/task-decomposer/SKILL.md'
      - 'skills/agent-work/task-decomposer/references/ORACLE_USE.md'
      - 'skills/agent-work/prototype-first/SKILL.md'
      - 'skills/agent-work/prototype-first/assets/oracle-slicing.md'
      - 'skills/agent-work/nudge-designer/SKILL.md'
      - 'skills/agent-work/nudge-designer/assets/prompts/oracle*.md'
      - 'skills/agent-work/nudge-designer/assets/prompts/successor.md'
      - 'skills/agent-work/nudge-designer/references/ORACLE_ONBOARD.md'
      - '.github/workflows/oracle-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'skills/agent-work/oracle-continuity/**'
      - 'skills/agent-work/START_HERE.md'
      - 'skills/agent-work/ENTRY_PROCESS_MAPS.md'
      - 'skills/agent-work/ROLE_LIFECYCLE.md'
      - 'skills/agent-work/oracle-standalone/SKILL.md'
      - 'skills/agent-work/oracle-standalone/references/CHANGEOVER.md'
      - 'skills/agent-work/oracle-standalone/references/PROGRESS_ADAPTER.md'
      - 'skills/agent-work/oracle-standalone/references/ORACLE_HANDOVER_PROTOCOL.md'
      - 'skills/agent-work/progress-page/references/MODES.md'
      - '.github/workflows/oracle-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: skills/agent-work/oracle-continuity
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install structural validator
        run: python -m pip install -r requirements.txt
      - name: Check examples, relationships and failure cases
        run: python -B -m unittest discover -s tests -v
      - name: Exercise worker and Oracle cutovers
        run: |
          python validate.py examples/worker-cutover.json --previous examples/initial.json --command examples/worker-cutover.command.json
          python validate.py examples/oracle-cutover.json --previous examples/worker-cutover.json --command examples/oracle-cutover.command.json
          python validate.py examples/completed.json --previous examples/oracle-cutover.json --command examples/completed.command.json --artifact-root examples
