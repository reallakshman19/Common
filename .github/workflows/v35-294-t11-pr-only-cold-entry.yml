name: "V3.5 #294 T11 PR-only cold-entry source HOLD (read-only)"

on:
  pull_request:
    paths:
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/t11-*'
      - '.github/workflows/v35-294-t11-pr-only-cold-entry.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  original-source-and-adversarial:
    name: T11 source and negative replay (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact tested source HEAD and originals preserved
        shell: bash
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2A_20261010/cross-source-vector-v1.mjs)" = "e5843e4ab141a49950cd8e2b380540eca8f8f938"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2B_20261010/pre-admission-boundary-v1.mjs)" = "5dc2675459bbadc9f6bba4f86b91ac0e3664a061"
      - name: PR-only source/currentness and no-authority adversarial tests
        shell: bash
        run: node --test relay/RECOVERY/V35_R14_WP2A_20261010/t11-pr-only-cold-entry.test.mjs

  live-pr-only-hold:
    name: T11 native PR-only live hold (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 311
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Two live PR308 source/ref/issue cycles, no independent successor or E
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_CANDIDATE_SHA: 087cf43193febffc31375e71359e767489d3ae68
          PR_ONLY_ENTRY_URL: https://github.com/reallakshman19/Common/pull/308
          TESTED_SCRIPT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SCRIPT_HEAD"
          node relay/RECOVERY/V35_R14_WP2A_20261010/t11-pr-only-cold-entry.mjs
