name: engineering-pr-delivery-v3.2

on:
  # Instantiate on every PR so the check is terminal even when V3.2 is irrelevant.
  # Path relevance is classified inside the job.
  pull_request:
  push:
    branches:
      - 'main'
      - 'relay-v3.2*'
    paths:
      - 'skills/engineering-pr-delivery-v3.2/**'
      - '.github/workflows/engineering-pr-delivery-v3.2.yml'

permissions:
  contents: read

jobs:
  validate-v3-2-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect V3.2 path relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$RUNNER_TEMP/relay-v32-changed-paths.txt"
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Path relevance could not be determined; running V3.2 validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              skills/engineering-pr-delivery-v3.2/*|.github/workflows/engineering-pr-delivery-v3.2.yml)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "Relay V3.2 candidate scope unchanged; check is NOT_APPLICABLE and terminal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: V3.2 scope not applicable
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "NOT_APPLICABLE: no engineering-pr-delivery-v3.2 paths changed."

      - name: Set up Python
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile V3.2 Python
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m compileall -q skills/engineering-pr-delivery-v3.2/scripts skills/engineering-pr-delivery-v3.2/tests

      - name: Validate V3.2 continuity schema syntax
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          path = pathlib.Path('skills/engineering-pr-delivery-v3.2/schemas/responsibility-continuity.schema.yaml')
          document = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert document['$id'] == 'relay-v3.2-responsibility-continuity'
          PY

      - name: Run V3.2 continuity regressions
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_continuity_v32*.py' -v

      - name: Run V3.2 audited-reality replay regressions
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_replay_cases_v32.py' -v

      - name: Run V3.2 native Relay Buddy Markdown transaction regressions
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_relay_tx.py' -v

      - name: Run V3.2 handover custody and explicit-reasoning regressions
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_handover_context.py' -v

      - name: Run V3.5 handover parity regressions
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.5/tests -p 'test_handover_context.py' -v

      - name: Verify shared handover parity or exact base-authorized V3.2 divergence
        if: steps.relevance.outputs.relevant == 'true'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import yaml

          manifest_path = "skills/Local_PR_Deliverty_v1.1/integration/frozen-v32-amendments.yaml"
          if os.environ["EVENT_NAME"] == "pull_request":
              base_sha = os.environ.get("PR_BASE_SHA") or ""
              if len(base_sha) != 40:
                  raise SystemExit("FROZEN_V32_PR_BASE_SHA_REQUIRED")
              manifest_bytes = subprocess.check_output(
                  ["git", "show", f"{base_sha}:{manifest_path}"]
              )
          else:
              manifest_bytes = pathlib.Path(manifest_path).read_bytes()
          manifest = yaml.safe_load(manifest_bytes)
          bounded_c4 = {
              "schemas/handover-context.schema.yaml",
              "scripts/handover_context.py",
              "tests/test_handover_context.py",
          }
          bounded_c6 = {
              "scripts/plan_handover.py",
              "tests/test_handover_context.py",
          }
          def base_authorized(amendment_id, bounded):
              matches = [
                  row for row in manifest.get("amendments", [])
                  if row.get("id") == amendment_id
              ]
              return (
                  len(matches) == 1
                  and matches[0].get("owner_authorized") is True
                  and set(matches[0].get("allowed_paths") or []) == {
                      "skills/engineering-pr-delivery-v3.2/" + path for path in bounded
                  }
              )
          c4_authorized = base_authorized("AMEND-V32-ES-RRECON-014", bounded_c4)
          c6_authorized = base_authorized("AMEND-V32-ES-RRECON-RUNTIME-015", bounded_c6)
          common = [
              "operating-model/two-pass-integration.md",
              "schemas/handover-context.schema.yaml",
              "scripts/handover_context.py",
              "scripts/plan_handover.py",
              "tests/test_handover_context.py",
          ]
          exceptions = []
          for relative in common:
              old = pathlib.Path("skills/engineering-pr-delivery-v3.2") / relative
              new = pathlib.Path("skills/engineering-pr-delivery-v3.5") / relative
              if old.read_bytes() == new.read_bytes():
                  continue
              approved_c4 = c4_authorized and relative in bounded_c4
              approved_c6 = c6_authorized and relative in bounded_c6
              if not (approved_c4 or approved_c6):
                  raise SystemExit(
                      f"HANDOVER_PARITY_OR_BASE_AUTHORIZATION_FAILED: {relative}"
                  )
              exceptions.append(relative)
          print("V32_V35_UNCHANGED_SHARED_PARITY=PASS")
          print("V32_EXACT_BASE_AUTHORIZED_DIFFERENCES=" + ",".join(exceptions))
          PY

      - name: Verify V3.1 isolation invariant
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.2/tests -p 'test_v31_isolation.py' -v
