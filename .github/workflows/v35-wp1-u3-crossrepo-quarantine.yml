name: V3.5 WP1 U3 cross-repo evidence quarantine
on:
  pull_request:
    paths:
      - 'skills/engineering-relay-v1/lifecycle-v35/cross_repo_u3_evidence_quarantine_v1.py'
      - 'skills/engineering-relay-v1/lifecycle-v35/test_cross_repo_u3_evidence_quarantine_v1.py'
      - 'skills/engineering-relay-v1/schemas/lifecycle-v35/cross-repo-u3-evidence-quarantine-v1.schema.json'
      - '.github/workflows/v35-wp1-u3-crossrepo-quarantine.yml'
permissions:
  contents: read
jobs:
  native-r14-u3-quarantine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native U1/U2/U3 schema dependency
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Exact tested source
        shell: bash
        run: git rev-parse HEAD
      - name: Run actual R14 source validators in full Common checkout
        shell: bash
        run: python -m unittest discover -s skills/engineering-relay-v1/lifecycle-v35 -p 'test_cross_repo_u3_evidence_quarantine_v1.py' -v
