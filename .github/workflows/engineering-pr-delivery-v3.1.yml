name: engineering-pr-delivery-v3.1

on:
  # Required PR checks must always instantiate. Path relevance is decided inside
  # the job so an irrelevant PR still receives a terminal successful check.
  pull_request:
  push:
    branches:
      - 'main'
      - 'v3.1/**'
    paths:
      - 'skills/engineering-pr-delivery-v3.1/**'
      - 'skills/two-pass-prompt-generator/**'
      - 'relay/**'
      - '.github/workflows/engineering-pr-delivery-v3.1.yml'

permissions:
  contents: read

jobs:
  validate-v3-1-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Relay path relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A PR base.sha can move after the feature branch forks. Diffing the
          # two tip SHAs directly includes unrelated base changes and falsely
          # runs legacy v3.1 tests on independent v3.6-only pull requests.
          # Merge-base..head matches the actual PR changed-file boundary.
          changed_paths="$RUNNER_TEMP/relay-changed-paths.txt"
          if ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" \
             || ! git diff --name-only --no-renames "$merge_base" "$HEAD_SHA" > "$changed_paths"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Path relevance could not be determined; running full validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "PR relevance computed from merge base $merge_base (not moving base tip)." >> "$GITHUB_STEP_SUMMARY"

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              skills/engineering-pr-delivery-v3.1/*|skills/two-pass-prompt-generator/*|relay/*|.github/workflows/engineering-pr-delivery-v3.1.yml)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "Relay scope unchanged; check is NOT_APPLICABLE and terminal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Relay scope not applicable
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "NOT_APPLICABLE: no engineering-pr-delivery-v3.1 paths changed."

      - name: Set up Python
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile V3.1 Python
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m compileall -q skills/engineering-pr-delivery-v3.1/scripts skills/engineering-pr-delivery-v3.1/tests
      - name: Validate standalone two-pass example
        if: steps.relevance.outputs.relevant == 'true'
        run: python skills/two-pass-prompt-generator/validate.py skills/two-pass-prompt-generator/examples/clean-two-pass-packet.md

      - name: Run V3.1 foundation tests
        if: steps.relevance.outputs.relevant == 'true'
        run: python -m unittest discover -s skills/engineering-pr-delivery-v3.1/tests -p 'test*.py' -v
