name: ONB-RWI WP5 twelve-section source handover

on:
  push:
    branches:
      - feat/onb391-wp5-handover-report
    paths:
      - 'skills/relay-onboarding-rwi/reporting/**'
      - 'skills/relay-onboarding-rwi/tests/test_report_wp5.py'
      - '.github/workflows/onb-rwi-wp5.yml'
  pull_request:
    paths:
      - 'skills/relay-onboarding-rwi/reporting/**'
      - 'skills/relay-onboarding-rwi/tests/test_report_wp5.py'
      - '.github/workflows/onb-rwi-wp5.yml'

permissions:
  contents: read

jobs:
  report-and-independent-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pure report tools and run 35 adversarial tests
        run: |
          python -m py_compile skills/relay-onboarding-rwi/reporting/compile_report.py skills/relay-onboarding-rwi/reporting/validate_report.py
          python -m unittest discover -s skills/relay-onboarding-rwi/tests -p 'test_report_wp5.py' -v
      - name: Generate actual 12-section ONBOARDING.md and matching manifests
        run: |
          python skills/relay-onboarding-rwi/reporting/compile_report.py \
            --input skills/relay-onboarding-rwi/reporting/fixtures/onb391-real-public-input.json \
            --out "$RUNNER_TEMP/onboarding-wp5"
      - name: Independently verify synchronized source, report and verdict
        run: |
          python skills/relay-onboarding-rwi/reporting/validate_report.py \
            --input skills/relay-onboarding-rwi/reporting/fixtures/onb391-real-public-input.json \
            --report "$RUNNER_TEMP/onboarding-wp5/ONBOARDING.md" \
            --manifest "$RUNNER_TEMP/onboarding-wp5/onboarding-manifest.json" \
            --verdict "$RUNNER_TEMP/onboarding-wp5/onboarding-verdict.json"
      - name: LIVE provider freshness check on source main and five draft PR heads
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          python skills/relay-onboarding-rwi/reporting/validate_report.py \
            --input skills/relay-onboarding-rwi/reporting/fixtures/onb391-real-public-input.json \
            --report "$RUNNER_TEMP/onboarding-wp5/ONBOARDING.md" \
            --manifest "$RUNNER_TEMP/onboarding-wp5/onboarding-manifest.json" \
            --verdict "$RUNNER_TEMP/onboarding-wp5/onboarding-verdict.json" \
            --live
      - name: Prepare public review artifact
        run: |
          mkdir -p artifacts/onboarding-wp5
          cp "$RUNNER_TEMP/onboarding-wp5/ONBOARDING.md" artifacts/onboarding-wp5/
          cp "$RUNNER_TEMP/onboarding-wp5/onboarding-manifest.json" artifacts/onboarding-wp5/
          cp "$RUNNER_TEMP/onboarding-wp5/onboarding-verdict.json" artifacts/onboarding-wp5/
      - name: Publish conditional handover, 30-day retention
        uses: actions/upload-artifact@v4
        with:
          name: onb391-wp5-public-handover
          path: artifacts/onboarding-wp5/
          retention-days: 30
