name: engineering-pr-delivery-v3.6-regressions

# Exact candidate source, read-only token, no untrusted shell interpolation,
# no provider writes. The previous workflows did not execute v3.6 tests.
on:
  pull_request:
    paths:
      - 'skills/engineering-pr-delivery-v3.6/**'
      - '.github/workflows/engineering-pr-delivery-v3.6-regressions.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/engineering-pr-delivery-v3.6/**'
      - '.github/workflows/engineering-pr-delivery-v3.6-regressions.yml'

permissions:
  contents: read

jobs:
  full-v36-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind actual candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Actual source HEAD $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install v3.6 schema dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile native v3.6 scripts and tests
        run: python -m compileall -q skills/engineering-pr-delivery-v3.6/scripts skills/engineering-pr-delivery-v3.6/tests

      - name: Complete native v3.6 regression suite (including ECO-05 live-scope tests)
        run: |
          python -m unittest discover -s skills/engineering-pr-delivery-v3.6/tests -p 'test_*_v36.py' -v

      - name: Explicit exact #426 fake-provider regressions
        run: |
          python -m unittest discover -s skills/engineering-pr-delivery-v3.6/tests -p 'test_eco05_live_scope_v36.py' -v
