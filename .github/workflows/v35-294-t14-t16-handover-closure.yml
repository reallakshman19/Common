name: "V3.5 #294 T14-T16 original bytes to handover read-only closure"

on:
  pull_request:
    paths:
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/t14-*'
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/t15-*'
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/t16-*'
      - '.github/workflows/v35-294-t14-t16-handover-closure.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  task-batch-original-negative-tests:
    name: "T14 T15 T16 negative contract (${{ matrix.os }}, Node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify actual checked-out HEAD and inherited source exact blobs
        shell: bash
        env:
          H: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$H"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2A_20261010/t13-r4-index-candidate.json)" = "c0e954710442f3fbea99553e38d81ac71dcf0bfd"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2A_20261010/t13-r4-index-candidate.mjs)" = "8b1e85d67e6597a6b033f23212e43f37958470f7"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2A_20261010/cross-source-vector-v1.mjs)" = "e5843e4ab141a49950cd8e2b380540eca8f8f938"
          test "$(git hash-object relay/RECOVERY/V35_R14_WP2B_20261010/pre-admission-boundary-v1.mjs)" = "5dc2675459bbadc9f6bba4f86b91ac0e3664a061"
      - name: T14 original physical byte falsifiers
        run: node --test relay/RECOVERY/V35_R14_WP2A_20261010/t14-source-blob-closure.test.mjs
      - name: T15 live diagnostic evidence-comment semantic falsifiers
        run: node --test relay/RECOVERY/V35_R14_WP2A_20261010/t15-comment-provenance.test.mjs
      - name: T16 handover first-failed-edge and no-authority falsifiers
        run: node --test relay/RECOVERY/V35_R14_WP2A_20261010/t16-diagnostic-handover.test.mjs

  original-native-source-to-handover:
    name: "T14→T15→T16 native read-only handover (${{ matrix.os }})"
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 315
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: GET original candidate index, 8 source files, 3 semantic comments and last PR source, no write
        shell: bash
        env:
          TESTED_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_CANDIDATE_HEAD"
          node relay/RECOVERY/V35_R14_WP2A_20261010/t16-diagnostic-handover.mjs
