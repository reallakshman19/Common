name: ONB-RWI focused contracts (no provider credentials)

on:
  pull_request:
    paths:
      - 'skills/relay-onboarding-rwi/**'
      - '.github/workflows/onb-rwi-focused.yml'
  push:
    branches:
      - 'feat/onb391-wp2-provider-readonly'
    paths:
      - 'skills/relay-onboarding-rwi/**'
      - '.github/workflows/onb-rwi-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without secrets
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bounded source
        run: |
          python -m py_compile skills/relay-onboarding-rwi/adapters/github.py
          python -m py_compile skills/relay-onboarding-rwi/adapters/v36.py
      - name: Run all committed ONB focused negative tests
        run: python -m unittest discover -s skills/relay-onboarding-rwi/tests -p 'test_*.py' -v
