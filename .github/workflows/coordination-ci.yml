name: coordination-ci

on:
  push:
    paths:
      - 'coordination/**'
      - '.github/workflows/coordination-ci.yml'
  pull_request:
    paths:
      - 'coordination/**'
      - '.github/workflows/coordination-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coordination:
    name: coordination-tests-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Log Git Head
        run: |
          git rev-parse HEAD
          git status --porcelain

      - name: Run Coordination Unit & Adversarial Tests
        run: |
          python -m unittest discover -s coordination/tests -v
