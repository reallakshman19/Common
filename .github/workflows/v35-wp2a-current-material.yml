name: V3.5 WP2-A U01-U03 current source and evidence observations (read-only)
on:
  pull_request:
    paths:
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/**'
      - '.github/workflows/v35-wp2a-current-material.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  u01-u03-source-falsifiers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact-head U01-U03 source and adversarial tests
        shell: bash
        run: |
          git rev-parse HEAD
          node --test relay/RECOVERY/V35_R14_WP2A_20261010/*.test.mjs

  live-current-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read native current issue/PR/base/head; no writes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git rev-parse HEAD
          node relay/RECOVERY/V35_R14_WP2A_20261010/current-candidate-material-v1.cli.mjs

  live-selected-required-ci:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Observe selected checks and separately read protection/ruleset requirements
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git rev-parse HEAD
          node relay/RECOVERY/V35_R14_WP2A_20261010/required-ci-material-v1.cli.mjs

  live-task-evidence-comment:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify prior pinned TASK_EVIDENCE source stays a claim and stale
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rev-parse HEAD
          node relay/RECOVERY/V35_R14_WP2A_20261010/task-evidence-comment-v1.cli.mjs

  u02-source-page-contract:
    name: "T31 U02 native source page integrity (${{ matrix.os }}, Node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact-head U02 source integrity tests, no provider writes
        shell: bash
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          node --test relay/RECOVERY/V35_R14_WP2A_20261010/required-ci-material-v1.test.mjs
