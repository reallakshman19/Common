name: BuddyRunner v1.7 independent interaction contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/buddy-runner-v1-7/**'
      - '.github/workflows/buddy-runner-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Compile renderer
        run: python -m py_compile skills/buddy-runner-v1-7/scripts/buddy_runner_v17.py
      - name: Validate v1.7 interaction boundaries
        run: python -m unittest discover -s skills/buddy-runner-v1-7/tests -p test_buddy_runner_v17.py -v
      - name: Render preparation and standalone evidence examples without provider writes
        run: |
          python skills/buddy-runner-v1-7/scripts/buddy_runner_v17.py --input skills/buddy-runner-v1-7/examples/handover-1a.json --output /tmp/buddy-v17-1a.md
          python skills/buddy-runner-v1-7/scripts/buddy_runner_v17.py --input skills/buddy-runner-v1-7/examples/task-evidence-y.json --output /tmp/buddy-v17-y.md
