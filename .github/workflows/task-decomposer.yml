name: Task Decomposer
on:
  pull_request:
    paths: ['skills/task-decomposer/**', '.github/workflows/task-decomposer.yml']
  push:
    branches: [main]
    paths: ['skills/task-decomposer/**', '.github/workflows/task-decomposer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Run independent task-map and CLI checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s skills/task-decomposer/tests -v
