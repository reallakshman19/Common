name: "V3.5 #294 T17-T21 Owner-independent read-only diagnostics"
on:
  pull_request:
    paths:
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/t17-t21-*'
      - '.github/workflows/v35-294-t17-t21-readonly.yml'
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  falsifiers:
    name: "T17-T21 17 fail-closed cases (${{ matrix.os }}, Node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact head and negative tests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --test relay/RECOVERY/V35_R14_WP2A_20261010/t17-t21-readonly-batch.test.mjs
  native:
    name: "T17-T21 actual GitHub read-only diagnostics (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Native current PR selected CI, original U03, required policy and workflow inventory
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          node relay/RECOVERY/V35_R14_WP2A_20261010/t17-t21-readonly-batch.mjs
