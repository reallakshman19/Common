name: "V3.5 #294 T02 exact-head native U01-U04 composite (read-only)"

on:
  pull_request:
    paths:
      - 'relay/RECOVERY/V35_R14_WP2A_20261010/**'
      - '.github/workflows/v35-294-t02-native-composite.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  exact-head-source-falsifiers:
    name: source-falsifiers (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pin tested Git HEAD and untouched six-source manifest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # Current-source integrity; immutable PR308 byte golden remains separately
          # locked by T14 ORIGINAL_FILES, not by this moving candidate test.
          cd relay/RECOVERY/V35_R14_WP2A_20261010
          test "$(git hash-object required-ci-material-v1.mjs)" = "9eeb0413805919720535b1180ac47f1e6e54b254"
          test "$(git hash-object required-ci-material-v1.test.mjs)" = "64d4175d6293b3e39d82ce0d5d56d20e4657a2b0"
          test "$(git hash-object task-evidence-comment-v1.mjs)" = "79cffd2e3d2828ac1727afad7763267768c56ad5"
          test "$(git hash-object task-evidence-comment-v1.test.mjs)" = "fb06f9360f5f72d12469c84ba933c282bc0ed3d8"
          test "$(git hash-object cross-source-vector-v1.mjs)" = "53b078341ef32839e8fdbf26ad7cbea0f9a3cc9a"
          test "$(git hash-object cross-source-vector-v1.test.mjs)" = "ec9f2d4b9e563ff2994bde0b859ab83dc46b5eeb"
      - name: Run original U01-U05 source and adversarial matrix
        shell: bash
        run: |
          node --test relay/RECOVERY/V35_R14_WP2A_20261010/*.test.mjs

  native-composite:
    name: actual-github-composite (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.repository == 'reallakshman19/Common' && github.event.pull_request.head.repo.full_name == 'reallakshman19/Common'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: One frozen PR and exact source head; genuine read-only GitHub native U01-U04
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          node relay/RECOVERY/V35_R14_WP2A_20261010/t02-native-composite-v1.cli.mjs
