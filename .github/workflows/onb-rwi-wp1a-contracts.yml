name: ONB-RWI WP1a contracts and WP5 schema compatibility

on:
  push:
    branches:
      - feat/onb391-wp1a-contracts
    paths:
      - 'skills/relay-onboarding-rwi/SKILL.md'
      - 'skills/relay-onboarding-rwi/schemas/**'
      - 'skills/relay-onboarding-rwi/scripts/validate_contract.py'
      - 'skills/relay-onboarding-rwi/tests/test_contracts.py'
      - 'skills/relay-onboarding-rwi/tests/fixtures/baseline.json'
      - '.github/workflows/onb-rwi-wp1a-contracts.yml'
  pull_request:
    paths:
      - 'skills/relay-onboarding-rwi/SKILL.md'
      - 'skills/relay-onboarding-rwi/schemas/**'
      - 'skills/relay-onboarding-rwi/scripts/validate_contract.py'
      - 'skills/relay-onboarding-rwi/tests/test_contracts.py'
      - 'skills/relay-onboarding-rwi/tests/fixtures/baseline.json'
      - '.github/workflows/onb-rwi-wp1a-contracts.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check strict versioned JSON and Python
        run: |
          python -m py_compile skills/relay-onboarding-rwi/scripts/validate_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("skills/relay-onboarding-rwi/schemas")
          for file in sorted(base.glob("*.schema.json")):
              schema=json.loads(file.read_text(encoding="utf-8"))
              assert schema["additionalProperties"] is False
              print(file.name,schema["properties"]["schema"]["const"])
          PY
      - name: Run fail-closed main-vs-PR and report-schema collision tests
        run: |
          python -m unittest discover -s skills/relay-onboarding-rwi/tests -p 'test_contracts.py' -v
