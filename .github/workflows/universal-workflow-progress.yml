name: Universal Workflow Progress — read-only observer

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      uwi_bootstrap:
        description: 'Explicit initial diagnostic state baseline (requires UWI opt-in)'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'skills/universal-workflow-progress/**'
      - '.github/workflows/universal-workflow-progress.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: universal-workflow-progress-observer
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate read-only monitor logic
        run: python -m unittest discover -s skills/universal-workflow-progress/tests -v
      - name: Python syntax
        run: python -m py_compile skills/universal-workflow-progress/scripts/*.py
  observe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore last snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=universal-workflow-progress-state&per_page=50" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name universal-workflow-progress-state --dir .state
            test -s .state/latest.json
            mv .state/latest.json .state/previous.json
          fi
      - name: Observe GitHub read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WF_GITHUB_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: python skills/universal-workflow-progress/scripts/check.py
      - name: Email changed observations only
        env:
          WF_SMTP_HOST: ${{ secrets.WF_SMTP_HOST }}
          WF_SMTP_PORT: ${{ secrets.WF_SMTP_PORT }}
          WF_SMTP_USER: ${{ secrets.WF_SMTP_USER }}
          WF_SMTP_PASSWORD: ${{ secrets.WF_SMTP_PASSWORD }}
          WF_ALERT_FROM: ${{ secrets.WF_ALERT_FROM }}
          WF_ALERT_TO: ${{ secrets.WF_ALERT_TO }}
        run: python skills/universal-workflow-progress/scripts/send_email.py .state/changes.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: universal-workflow-progress-state
          path: .state/latest.json
          retention-days: 30

  uwi-handoff:
    # Opt-in diagnostic sidecar. Runs within the EXISTING monitor workflow only.
    # A failed sidecar cannot stop or rewrite the upstream observation/email job.
    needs: observe
    if: github.event_name != 'pull_request' && vars.UWI_DIAGNOSTIC_HANDOFF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download same-run upstream snapshot
        uses: actions/download-artifact@v4
        with:
          name: universal-workflow-progress-state
          path: .state/upstream
      - name: Restore trusted prior UWI artifact
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.uwi_bootstrap == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          run_id="$(python skills/workflow-intelligence/scripts/restore_previous.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --branch main)"
          mkdir -p .state/restored
          gh run download "$run_id" \
            --name uwi-diagnostic-handoff-state \
            --dir .state/restored
          test -s .state/restored/uwi-handoff.json
          mv .state/restored/uwi-handoff.json .state/previous-uwi-handoff.json
      - name: Reconcile diagnostic-only monitor state
        env:
          UWI_BOOTSTRAP: ${{ inputs.uwi_bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          test -s .state/upstream/latest.json
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${UWI_BOOTSTRAP}" = true ]; then
            python skills/workflow-intelligence/scripts/monitor_handoff.py \
              --monitor-current .state/upstream/latest.json \
              --bootstrap \
              --output-artifact .state/uwi-handoff.json
          else
            test -s .state/previous-uwi-handoff.json
            python skills/workflow-intelligence/scripts/monitor_handoff.py \
              --monitor-current .state/upstream/latest.json \
              --previous-artifact .state/previous-uwi-handoff.json \
              --output-artifact .state/uwi-handoff.json
          fi
      - name: Publish diagnostic state only
        uses: actions/upload-artifact@v4
        with:
          name: uwi-diagnostic-handoff-state
          path: .state/uwi-handoff.json
          retention-days: 30
          if-no-files-found: error
